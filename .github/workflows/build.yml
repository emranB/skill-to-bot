name: Build and verify

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  end-to-end:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install check tools
        run: |
          python -m pip install -r requirements-dev.txt
          npm ci --prefix apps/web
          cd apps/web
          npx playwright install --with-deps chromium
      - name: Check source and build
        run: |
          python -m ruff --version
          python -m ruff check services tests
          python -m ruff format --check services tests
          npm run format:check --prefix apps/web
          npm run build --prefix apps/web
          docker compose config --quiet
          mkdir -p data/runs data/live_demos
          bash build-and-run.sh
      - name: Verify service regressions and production segmentation
        run: |
          docker compose run --rm --no-deps perception python -m pytest tests -q
          docker compose run --rm --no-deps orchestrator python -m pytest tests -q
          docker compose run --rm --no-deps simulation python -m pytest tests -q
      - name: Verify calibrated depth, manipulation, and failure recovery
        env:
          RUN_INTEGRATION: "1"
        run: python -m pytest tests -q
      - name: Verify desktop, mobile, and synthetic-camera workflows
        run: npm test --prefix apps/web
      - name: Collect diagnostics
        if: always()
        run: docker compose logs --no-color > compose.log
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: failure()
        with:
          name: failure-diagnostics
          path: |
            compose.log
            apps/web/test-results/
            data/runs/
          retention-days: 7
      - name: Stop runtime
        if: always()
        run: bash clean.sh
