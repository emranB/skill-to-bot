# Purpose: Build and lint the drawing app without running the test suite.
name: Build and verify

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - name: Install check tools
        timeout-minutes: 10
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip check
          npm ci --prefix src/frontend
      - name: Check source and production bundle
        timeout-minutes: 10
        run: |
          python -m ruff check src/backend tests
          python -m ruff format --check src/backend tests
          npm run format:check --prefix src/frontend
          npm run build --prefix src/frontend
          npm audit --omit=dev --audit-level=high --prefix src/frontend
          docker compose config --quiet
      - name: Build container images
        timeout-minutes: 15
        run: docker compose build
