# Purpose: Serve the drawing workspace and proxy bounded JSON and run artifacts.
server {
  listen 5173;
  server_tokens off;
  root /usr/share/nginx/html;
  client_max_body_size 3m;
  resolver 127.0.0.11 valid=10s;
  set $backend http://orchestrator:8000;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  location /api/ {
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $backend;
    proxy_set_header Host $http_host;
    proxy_read_timeout 30s;
  }
  location = /health { default_type text/plain; return 200 'ok'; }
  location = /index.html { expires -1; }
  location /assets/ { try_files $uri =404; expires 1y; }
  location / { try_files $uri $uri/ /index.html; }
}
